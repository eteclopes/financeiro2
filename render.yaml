services:
  - type: web
    name: financeiro-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_ALLOW_PREVIEWS
        value: "false"
      - key: CORS_VERCEL_PROJECT
        sync: false
      - key: CORS_VERCEL_TEAM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: APP_TIME_ZONE
        value: America/Sao_Paulo
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: financehub-api
      - key: JWT_AUDIENCE
        value: financehub-web
      - key: JWT_ADMIN_AUDIENCE
        value: financehub-admin
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: "30"
      - key: PASSWORD_RESET_EXPIRES_IN_HOURS
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_LIFETIME_PRICE_ID
        sync: false
      - key: STRIPE_API_VERSION
        value: 2026-06-24.dahlia
      - key: PRO_LIFETIME_PRICE_LABEL
        value: Oferta vitalícia
